<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Next - Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo-box">
        <img src="logo.png" class="logo" alt="Gift Next">
        <h2>GIFT-NEXT</h2>
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="cart.html">🛒 Cart</a>
    </nav>
</header>

<section class="product-details">

    <div class="product-image">
        <img src="gift1.jpg" alt="Couple Gift Box">
    </div>

    <div class="product-info">
        <h1>Couple Gift Box</h1>

        <p>⭐⭐⭐⭐⭐ (4.9)</p>

        <h2>₹299</h2>

        <p>
            Premium Couple Gift Box with beautiful packaging.
            Perfect for birthdays, anniversaries and special occasions.
        </p>

        <button>Add to Cart</button>
        <div class="quantity-box">
    <button id="minus">-</button>
    <span id="qty">1</span>
    <button id="plus">+</button>
</div>
        <button>Buy Now</button>

    </div>

</section>
<section class="related-products">
    <h2>Related Products</h2>

    <div class="product-grid">

        <div class="product-card">
            <img src="gift2.jpg" alt="Crochet Flower">
            <h3>Crochet Flower</h3>
            <p>₹399</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="gift3.jpg" alt="Keychain">
            <h3>Custom Keychain</h3>
            <p>₹149</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="gift4.jpg" alt="Birthday Hamper">
            <h3>Birthday Hamper</h3>
            <p>₹999</p>
            <button>Add to Cart</button>
        </div>

    </div>
</section>

</body>
</html>
